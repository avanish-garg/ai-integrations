plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.2'
}

description = 'Temporal Spring AI integration (Public Preview)'
ext {
    javaRelease = 17
    temporalVersion = '1.40.0'
    springAiVersion = '2.0.1'
    springBootVersion = providers.gradleProperty('springBootVersion').getOrElse('4.0.8')
}

apply from: '../_shared/java.gradle'

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    api platform("org.springframework.ai:spring-ai-bom:$springAiVersion")
    // Consumers supply the SDK, including when using its shaded artifact.
    compileOnly "io.temporal:temporal-sdk:$temporalVersion"
    compileOnly "io.temporal:temporal-spring-boot-autoconfigure:$temporalVersion"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.springframework.ai:spring-ai-rag'
    compileOnly 'org.springframework.ai:spring-ai-mcp'

    testImplementation "io.temporal:temporal-sdk:$temporalVersion"
    testImplementation "io.temporal:temporal-testing:$temporalVersion"
    testImplementation "io.temporal:temporal-spring-boot-starter:$temporalVersion"
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.ai:spring-ai-rag'
    testImplementation 'org.springframework.ai:spring-ai-mcp'
    testImplementation 'org.springframework.ai:spring-ai-retry'
    testImplementation 'org.springframework.ai:spring-ai-openai'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
